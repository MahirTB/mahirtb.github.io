<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor — Mahir Tajwar Bhuiyan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Fira+Code:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css?v=37">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/mtb_logo_trimmed.png">
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1 style="font-size: 1.5rem;">Editor</h1>
                <p>Create new content</p>
            </div>
            <nav>
                <a href="./">Home</a>
                <a href="projects">Projects</a>
                <a href="blogs">Blogs</a>
            </nav>
        </header>

        <main style="padding-top: 48px;">
            <div id="editor-form-container">

                <div class="input-group">
                    <label for="type">Content Type</label>
                    <select id="type">
                        <option value="blog">Blog Post</option>
                        <option value="project">Project</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Enter title...">
                </div>

                <div class="input-group">
                    <label for="summary">Summary</label>
                    <input type="text" id="summary" placeholder="One sentence summary...">
                </div>

                <div class="input-group">
                    <label>Thumbnail / Cover Image</label>
                    <p class="thumbnail-picker-hint">Select a photo from this project to use as the card thumbnail, or upload a custom cover.</p>
                    <div id="thumbnail-picker-container" class="thumbnail-picker-container">
                        <div id="thumbnail-grid" class="thumbnail-grid">
                            <p class="thumb-empty-msg">No images found in content yet. Upload images in the content editor or upload a custom thumbnail below.</p>
                        </div>
                        <div class="thumbnail-actions">
                            <button type="button" id="uploadThumbBtn" class="btn-secondary"><i class="fas fa-upload" style="margin-right: 6px;"></i>Upload Custom Thumbnail</button>
                            <button type="button" id="removeThumbBtn" class="btn-secondary" style="display: none; color: #c0392b; border-color: rgba(192, 57, 43, 0.4);"><i class="fas fa-times" style="margin-right: 6px;"></i>Remove Thumbnail</button>
                            <input type="file" id="thumbFileInput" accept="image/*" style="display: none;">
                        </div>
                        <input type="hidden" id="selectedThumbnail" value="">
                    </div>
                </div>

                <label>Content</label>
                <div class="toolbar">
                    <button type="button" onmousedown="event.preventDefault()" data-command="bold"><i
                            class="fas fa-bold"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="italic"><i
                            class="fas fa-italic"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="formatBlock"
                        data-value="<h3>">H3</button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="justifyLeft"><i
                            class="fas fa-align-left"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="justifyCenter"><i
                            class="fas fa-align-center"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="justifyRight"><i
                            class="fas fa-align-right"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="justifyFull"><i
                            class="fas fa-align-justify"></i></button>
                    <button type="button" onmousedown="event.preventDefault()" data-command="createLink"><i
                            class="fas fa-link"></i></button>
                    <button type="button" onmousedown="event.preventDefault()"
                        onclick="document.getElementById('imageInput').click()"><i class="fas fa-image"></i></button>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <div id="editor" class="editor-container" contenteditable="true">
                    <p>Start writing here...</p>
                </div>

                <div style="margin-top: 20px;">
                    <button id="saveBtn" class="btn">Save Content</button>
                    <span id="status"
                        style="margin-left: 14px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent);"></span>
                </div>
            </div>
        </main>
    </div>

    <script src="scripts/editor.js?v=4"></script>
</body>

</html>
